[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.88"
publish = false

[workspace.dependencies]
link-proto = { path = "crates/link-proto" }
link-core = { path = "crates/link-core" }
anyhow = "1"
base64 = "0.22"
cddl = { version = "0.10", default-features = false, features = ["std", "ast-span", "ast-comments", "json", "cbor", "additional-controls", "ast-parent"] }
ciborium = "0.2"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color"] }
if-addrs = "0.15"
log = "0.4"
mdns-sd = "0.21"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
spake2 = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "net", "time", "signal", "sync", "io-util", "fs"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
