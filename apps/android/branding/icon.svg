<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1F2B"/>
      <stop offset="1" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5CE7FF"/>
      <stop offset="1" stop-color="#00A8D6"/>
    </linearGradient>
  </defs>
  <rect width="108" height="108" fill="url(#bg)"/>
  <!-- desktop -->
  <rect x="25" y="33" width="42" height="29" rx="6" fill="none" stroke="#00D7FF" stroke-width="4"/>
  <path d="M36 70 H56" stroke="#00D7FF" stroke-width="4" stroke-linecap="round"/>
  <path d="M46 62 V70" stroke="#00D7FF" stroke-width="4"/>
  <!-- phone, docked over the desktop's corner -->
  <rect x="58" y="41" width="25" height="38" rx="6.5" fill="#0A0A0A"/>
  <rect x="61" y="44" width="19" height="32" rx="4.5" fill="url(#glow)"/>
  <path d="M67.5 71 H73.5" stroke="#0A0A0A" stroke-width="2.4" stroke-linecap="round"/>
  <!-- link pulse between them -->
  <circle cx="46" cy="47.5" r="3.2" fill="#00D7FF"/>
  <path d="M52 41.5 a8.5 8.5 0 0 1 0 12" fill="none" stroke="#00D7FF" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
</svg>
