# A desktop's file offer is in the notification shade; tapping it opens Accept and Decline, and Accept accepts it.
appId: org.umbriel.link
---
- swipe:
    start: 50%, 0%
    end: 50%, 70%
- extendedWaitUntil:
    visible: ".*wants to send.*"
    timeout: 20000
- takeScreenshot: ${OUT}/7-offer
- tapOn: ".*wants to send.*"
- extendedWaitUntil:
    visible: "Accept"
    timeout: 10000
- tapOn: "Accept"
