appId: org.andromeda.link
---
- launchApp:
    # An explicit list: by default Maestro grants every permission, READ_LOGS too, which kills the app.
    permissions: { notifications: allow }
    stopApp: false
- tapOn: "Activity tab"
- extendedWaitUntil:
    visible: "(?i)waiting"
    timeout: 15000
- takeScreenshot: ${OUT}/7-offer-in-activity
- tapOn: "Accept"
# The sent card already reads "Completed", so wait for the offer's chip to go instead.
- extendedWaitUntil:
    notVisible: "(?i)waiting"
    timeout: 30000
- takeScreenshot: ${OUT}/7-received-in-activity
- tapOn: "Home tab"
