appId: org.andromeda.link
---
- launchApp:
    # An explicit list: by default Maestro grants every permission, READ_LOGS too, which kills the app.
    permissions: { notifications: allow }
    stopApp: false
- tapOn: "Activity tab"
- extendedWaitUntil:
    visible: "Waiting for your approval"
    timeout: 15000
- takeScreenshot: ${OUT}/7-offer-in-activity
- tapOn: "Accept"
- extendedWaitUntil:
    visible: "Completed"
    timeout: 30000
- takeScreenshot: ${OUT}/7-received-in-activity
- tapOn: "Home tab"
