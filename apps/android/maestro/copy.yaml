# The script opens the shade with `cmd statusbar expand-notifications`: a swipe can snap back shut. Tapping the
# desktop's text copies it. Android bundles the app's two notifications and hides their buttons; the tap runs the
# content intent, the same PendingIntent as the Copy button.
appId: org.andromeda.link
---
- extendedWaitUntil:
    visible: "Text from .*"
    timeout: 10000
- takeScreenshot: ${OUT}/5-shade
- tapOn: "Text from .*"
