# Opens the Media screen, where the desktop's test player shows, and pauses it.
appId: org.andromeda.link
---
- launchApp:
    stopApp: false
# READ_LOGS is sometimes granted during the run (cause not found); Android then asks before the log reader starts.
- tapOn:
    text: "Don.t allow"
    optional: true
- scrollUntilVisible:
    element: "Media"
- tapOn: "Media"
- extendedWaitUntil:
    visible: "Desk Session"
    timeout: 15000
- takeScreenshot: ${OUT}/3-desktop-media
- tapOn: "Pause"
# A tap at the middle of each bar: half the track, half the player's volume, and half the desk's volume.
- tapOn: "Position"
- tapOn: "Player volume"
- tapOn: "Desktop volume"
