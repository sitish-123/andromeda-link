# Picks the two fixture photos in the in-app picker and sends them to the desktop.
appId: org.andromeda.link
---
- launchApp:
    # An explicit list: by default Maestro grants every permission, READ_LOGS too, which kills the app.
    permissions: { notifications: allow }
    stopApp: false
- tapOn: "Home tab"
- scrollUntilVisible:
    element: "Photos"
    direction: UP
- tapOn: "Photos"
- extendedWaitUntil:
    visible: "e2e-pick-a.png"
    timeout: 10000
- tapOn: "e2e-pick-a.png"
- tapOn: "e2e-pick-b.png"
- takeScreenshot: ${OUT}/9-picker-selected
- tapOn: "Send 2 items.*"
