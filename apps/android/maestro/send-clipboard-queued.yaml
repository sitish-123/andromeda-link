# Home's Clipboard tile while the desktop is away: the clip waits for it, and Home says so.
appId: org.andromeda.link
---
- launchApp:
    stopApp: false
# A tap during the launch transition can be lost, and the app stays on its last tab.
- tapOn:
    text: "Home tab"
    retryTapIfNoChange: true
- tapOn: "Clipboard"
- extendedWaitUntil:
    visible: "Will send when .* connects"
    timeout: 10000
- takeScreenshot: ${OUT}/10-will-send
