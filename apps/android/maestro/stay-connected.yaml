# Toggles "Stay connected" in Settings and returns to Home.
appId: org.umbriel.link
---
- launchApp:
    stopApp: false
- tapOn: "Settings tab"
- scrollUntilVisible:
    element: "Stay connected"
- tapOn:
    text: "Stay connected"
- takeScreenshot: ${OUT}/stay-connected-${STAY}
- tapOn:
    text: "Home tab"
    optional: true
