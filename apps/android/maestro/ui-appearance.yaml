appId: org.andromeda.link
---
- launchApp:
    # An explicit list: by default Maestro grants every permission, READ_LOGS too, which kills the app.
    permissions: { notifications: allow }
    stopApp: false
- tapOn: "Settings tab"
- scrollUntilVisible:
    element: "Appearance"
- tapOn: "Dark"
- takeScreenshot: ${OUT}/appearance-dark
- launchApp:
    # An explicit list: by default Maestro grants every permission, READ_LOGS too, which kills the app.
    permissions: { notifications: allow }
    stopApp: true
- tapOn: "Settings tab"
- scrollUntilVisible:
    element: "Appearance"
- takeScreenshot: ${OUT}/appearance-dark-after-restart
- tapOn: "Light"
- takeScreenshot: ${OUT}/appearance-light
- tapOn: "System"
- tapOn: "Home tab"
