# Screenshots of every screen of a paired phone, in ${THEME}: Home, Activity, Settings, the picker's three tabs, the desktop's page, the
# app filter, Media with the desktop's test player, and each page of the permission onboarding.
appId: org.andromeda.link
---
- launchApp:
    # An explicit list: by default Maestro grants every permission, READ_LOGS too, which kills the app.
    permissions: { notifications: allow }
    stopApp: false
- extendedWaitUntil:
    visible: "Wi-Fi"
    timeout: 20000
- takeScreenshot: ${OUT}/${THEME}-home
- tapOn: "Activity tab"
- takeScreenshot: ${OUT}/${THEME}-activity-empty
- tapOn: "Settings tab"
- takeScreenshot: ${OUT}/${THEME}-settings
- scrollUntilVisible:
    element: "Appearance"
- takeScreenshot: ${OUT}/${THEME}-settings-appearance
- scrollUntilVisible:
    element: "Permissions"
    direction: UP
- tapOn:
    text: "Permissions"
    index: 0
    optional: true
- extendedWaitUntil:
    visible: "Notifications on your desktop"
    timeout: 10000
- takeScreenshot: ${OUT}/${THEME}-onboarding-1-notifications
- tapOn: "Next"
- takeScreenshot: ${OUT}/${THEME}-onboarding-2-dnd
- tapOn: "Next"
- takeScreenshot: ${OUT}/${THEME}-onboarding-3-post
- tapOn: "Next"
- takeScreenshot: ${OUT}/${THEME}-onboarding-4-battery
- tapOn: "Next"
- takeScreenshot: ${OUT}/${THEME}-onboarding-5-calls
- tapOn: "Next"
- takeScreenshot: ${OUT}/${THEME}-onboarding-6-bluetooth
- tapOn: "Next"
- takeScreenshot: ${OUT}/${THEME}-onboarding-7-texts
- tapOn: "Next"
- takeScreenshot: ${OUT}/${THEME}-onboarding-8-clipboard
- tapOn: "Done"
- tapOn: "Home tab"
- extendedWaitUntil:
    visible: "Features and pairing"
    timeout: 10000
# A capability report can arrive now and move Home's rows; tap once they stop.
- waitForAnimationToEnd
- tapOn: "Features and pairing"
- extendedWaitUntil:
    visible: "Shared with this desktop"
    timeout: 10000
- takeScreenshot: ${OUT}/${THEME}-device
- scrollUntilVisible:
    element: "Screen & storage access"
- takeScreenshot: ${OUT}/${THEME}-device-advanced
- scrollUntilVisible:
    element: "Choose which apps"
    direction: UP
- tapOn: "Choose which apps"
- extendedWaitUntil:
    visible: "Every app is mirrored unless you turn it off here."
    timeout: 10000
- takeScreenshot: ${OUT}/${THEME}-app-filter
- pressKey: Back
- pressKey: Back
# Home's player card opens Media.
- scrollUntilVisible:
    element: "Desk Session"
- tapOn: "Desk Session"
- extendedWaitUntil:
    visible: "Desk Session"
    timeout: 15000
- takeScreenshot: ${OUT}/${THEME}-media
- pressKey: Back
- scrollUntilVisible:
    element: "Photos"
    direction: DOWN
- tapOn: "Photos"
- extendedWaitUntil:
    visible: "e2e-pick-a.png"
    timeout: 10000
- tapOn: "e2e-pick-a.png"
- takeScreenshot: ${OUT}/${THEME}-picker-photos
- tapOn: "Videos"
- takeScreenshot: ${OUT}/${THEME}-picker-videos
# The tab, not Home's Files text behind the sheet.
- tapOn:
    text: "Files"
    rightOf: "Videos"
- scrollUntilVisible:
    element: "Pictures"
- takeScreenshot: ${OUT}/${THEME}-picker-files
- pressKey: Back
- takeScreenshot: ${OUT}/${THEME}-home-selected
# Sending the picked photo puts it in Recent; the desktop auto-accepts it.
- tapOn: "Send 1 item.*"
- scrollUntilVisible:
    element: "Sent, .*"
    timeout: 20000
- takeScreenshot: ${OUT}/${THEME}-home-recent
- scrollUntilVisible:
    element: "Turn on"
- takeScreenshot: ${OUT}/${THEME}-home-bottom
