# Screenshots of every screen of a paired phone, in ${THEME}: Home, the picker's three tabs, the desktop's page, the
# app filter, Media with the desktop's test player, and each page of the permission onboarding.
appId: org.umbriel.link
---
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: "Connected"
    timeout: 20000
- takeScreenshot: ${OUT}/${THEME}-home
- scrollUntilVisible:
    element: "Stay connected"
- takeScreenshot: ${OUT}/${THEME}-home-scrolled
- tapOn:
    text: "Permissions"
    index: 0
    optional: true
- extendedWaitUntil:
    visible: "Notifications on your desktop"
    timeout: 10000
- takeScreenshot: ${OUT}/${THEME}-onboarding-1-notifications
- tapOn: "Next"
- takeScreenshot: ${OUT}/${THEME}-onboarding-2-dnd
- tapOn: "Next"
- takeScreenshot: ${OUT}/${THEME}-onboarding-3-post
- tapOn: "Next"
- takeScreenshot: ${OUT}/${THEME}-onboarding-4-battery
- tapOn: "Next"
- takeScreenshot: ${OUT}/${THEME}-onboarding-5-calls
- tapOn: "Next"
- takeScreenshot: ${OUT}/${THEME}-onboarding-6-bluetooth
- tapOn: "Next"
- takeScreenshot: ${OUT}/${THEME}-onboarding-7-clipboard
- tapOn: "Done"
- extendedWaitUntil:
    visible: "Desktop settings"
    timeout: 10000
- tapOn: "Desktop settings"
- extendedWaitUntil:
    visible: "Shared with this desktop"
    timeout: 10000
- takeScreenshot: ${OUT}/${THEME}-device
- tapOn: "Choose which apps"
- extendedWaitUntil:
    visible: "Every app is mirrored unless you turn it off here."
    timeout: 10000
- takeScreenshot: ${OUT}/${THEME}-app-filter
- pressKey: Back
- pressKey: Back
- scrollUntilVisible:
    element: "Media"
- tapOn: "Media"
- extendedWaitUntil:
    visible: "Desk Session"
    timeout: 15000
- takeScreenshot: ${OUT}/${THEME}-media
- pressKey: Back
- scrollUntilVisible:
    element: "Photos"
    direction: UP
- tapOn: "Photos"
- extendedWaitUntil:
    visible: "e2e-pick-a.png"
    timeout: 10000
- tapOn: "e2e-pick-a.png"
- takeScreenshot: ${OUT}/${THEME}-picker-photos
- tapOn: "Videos"
- takeScreenshot: ${OUT}/${THEME}-picker-videos
- tapOn: "Files"
- extendedWaitUntil:
    visible: "Pictures"
    timeout: 10000
- takeScreenshot: ${OUT}/${THEME}-picker-files
- pressKey: Back
- takeScreenshot: ${OUT}/${THEME}-home-selected
- tapOn: "e2e-pick-a.png"
