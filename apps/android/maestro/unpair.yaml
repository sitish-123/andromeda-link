# Unpairs the only desktop from its page, opened from the gear beside its name on Home.
appId: org.andromeda.link
---
- launchApp:
    # An explicit list: by default Maestro grants every permission, READ_LOGS too, which kills the app.
    permissions: { notifications: allow }
    stopApp: false
- tapOn: "Home tab"
- scrollUntilVisible:
    element: "Features and pairing"
    direction: UP
- tapOn: "Features and pairing"
- scrollUntilVisible:
    element: "Unpair"
- tapOn: "Unpair"
- extendedWaitUntil:
    visible: "Unpair desktop\\?"
    timeout: 5000
- tapOn: "Unpair"
- extendedWaitUntil:
    visible: "Scan your desktop"
    timeout: 15000
- takeScreenshot: ${OUT}/8-unpaired
