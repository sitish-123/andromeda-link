# Unpairs the only desktop from its page, opened from the Home screen's hero.
appId: org.umbriel.link
---
- launchApp:
    stopApp: false
- scrollUntilVisible:
    element: "Features and pairing"
    direction: UP
- tapOn: "Features and pairing"
- scrollUntilVisible:
    element: "Unpair"
- tapOn: "Unpair"
- extendedWaitUntil:
    visible: "No desktops yet"
    timeout: 15000
- takeScreenshot: ${OUT}/8-unpaired
