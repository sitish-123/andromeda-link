# Unpairs the only desktop from its page, opened from the gear beside its name on Home.
appId: org.umbriel.link
---
- launchApp:
    stopApp: false
- scrollUntilVisible:
    element: "Desktop settings"
    direction: UP
- tapOn: "Desktop settings"
- scrollUntilVisible:
    element: "Unpair"
- tapOn: "Unpair"
- extendedWaitUntil:
    visible: "No desktops yet"
    timeout: 15000
- takeScreenshot: ${OUT}/8-unpaired
