[package]
name = "link-daemon"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "andromeda-linkd"
path = "src/main.rs"

[dependencies]
link-api.workspace = true
link-core.workspace = true
link-quickshare.workspace = true
futures-util.workspace = true
hex.workspace = true
serde.workspace = true
anyhow.workspace = true
env_logger.workspace = true
log.workspace = true
quinn.workspace = true
httparse.workspace = true
ring.workspace = true
rustix = { workspace = true, features = ["process"] }
rustls.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process"] }
tokio-rustls.workspace = true
libc = "0.2"
zbus.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFFileDescriptor", "CFRunLoop"] }
objc2-core-wlan = { version = "0.3", default-features = false, features = ["std", "CWInterface", "CWNetwork", "CWWiFiClient"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSEnumerator", "NSError", "NSSet", "NSString", "NSValue"] }
objc2-io-bluetooth = { version = "0.3", default-features = false, features = ["std", "objc2", "objc2-foundation", "Bluetooth", "IOBluetoothHostController", "IOBluetoothObject", "IOBluetoothRFCOMMChannel", "IOBluetoothSDPServiceRecord", "IOBluetoothUserLib", "IOBluetoothUserNotification"] }

# The macOS backends call C and Objective-C APIs, so their modules allow unsafe code; everywhere else denies it.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
unwrap_used = "warn"
expect_used = "warn"
