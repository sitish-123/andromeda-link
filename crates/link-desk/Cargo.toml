[package]
name = "link-desk"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "andromeda-link-qt"
path = "src/main.rs"

[dependencies]
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }
env_logger.workspace = true
futures-util.workspace = true
link-api.workspace = true
log.workspace = true
rustix.workspace = true
tokio.workspace = true
zbus.workspace = true

[build-dependencies]
cxx-qt-build = "0.10"
qt-build-utils = "0.10"

# cxx-qt bridges need unsafe extern blocks, which the workspace forbids.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
unwrap_used = "warn"
expect_used = "warn"
