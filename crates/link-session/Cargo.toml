[package]
name = "link-session"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "andromeda-link-session"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
env_logger.workspace = true
futures-util.workspace = true
gstreamer = "0.25"
gstreamer-app = "0.25"
link-api.workspace = true
log.workspace = true
reis = { version = "0.7", features = ["tokio"] }
rustix = { workspace = true, features = ["event", "time"] }
tokio = { workspace = true, features = ["net", "process"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
x11rb = { version = "0.14", features = ["xfixes", "xtest"] }
xkbcommon = { version = "0.9", default-features = false }
zbus.workspace = true

[lints]
workspace = true
