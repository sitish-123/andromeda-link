[graph]
all-features = false

[advisories]
yanked = "deny"
ignore = [
  # basic-toml is unmaintained; only askama_derive (UniFFI's codegen, build time) uses it, and every askama still does.
  { id = "RUSTSEC-2026-0374", reason = "build-time only, through uniffi's askama; no maintained alternative upstream" },
  # zbus 5's split crates, merged into zbus 6; only ksni (the tray icon) still uses zbus 5, in its newest release.
  { id = "RUSTSEC-2026-0370", reason = "zvariant 5, through ksni; no ksni on zbus 6 yet" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names 4, through ksni; no ksni on zbus 6 yet" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive 5, through ksni; no ksni on zbus 6 yet" },
]

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "ISC", "BSD-2-Clause", "BSD-3-Clause",
  "Unicode-3.0", "Zlib", "CDLA-Permissive-2.0", "MPL-2.0", "CC0-1.0", "Unlicense"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
