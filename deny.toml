[graph]
all-features = false

[advisories]
yanked = "deny"
ignore = [
  # basic-toml is unmaintained; only askama_derive (UniFFI's codegen, build time) uses it, and every askama still does.
  { id = "RUSTSEC-2026-0374", reason = "build-time only, through uniffi's askama; no maintained alternative upstream" },
]

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "ISC", "BSD-2-Clause", "BSD-3-Clause",
  "Unicode-3.0", "Zlib", "CDLA-Permissive-2.0", "MPL-2.0", "CC0-1.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
