# Umbriel Link reaches a paired phone over Bluetooth. The laptop then must not also look like a speaker or a headset
# to that phone, or the phone may move its media and calls off its earbuds onto the laptop. So the laptop advertises
# only the roles it uses toward headphones: the classic audio source and handsfree gateway, and both LE Audio roles
# (LE earbuds send their microphone back through the sink one). Classic A2DP sink and handsfree unit are left out.
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_source hfp_ag bap_source bap_sink ]
}
