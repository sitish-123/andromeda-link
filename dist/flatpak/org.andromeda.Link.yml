# The Link app as a Flatpak, for releases whose Qt is older than 6.7 (Ubuntu 24.04). The daemon and the session stay
# on the host (andromeda-link .deb); the app only talks to them over the session bus.
# Crates come from cargo-sources.json; after a Cargo.lock change run tools/flatpak-cargo-sources.py Cargo.lock
# dist/flatpak/cargo-sources.json. Local build: flatpak run org.flatpak.Builder --user --install --force-clean \
#   --disable-rofiles-fuse --state-dir ~/.cache/link-flatpak/state ~/.cache/link-flatpak/build dist/flatpak/org.andromeda.Link.yml
id: org.andromeda.Link
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: andromeda-link
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  - --talk-name=org.andromeda.Link1
  - --talk-name=org.mpris.MediaPlayer2.*
  - --talk-name=org.kde.StatusNotifierWatcher
  # ksni names its tray item after the PID, which is 2 inside the sandbox.
  - --own-name=org.kde.StatusNotifierItem-2-1
modules:
  - name: andromeda-link
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/andromeda-link/cargo
    build-commands:
      - cargo build --release --offline --locked -p link-desk
      - install -Dm755 target/release/andromeda-link /app/bin/andromeda-link
      - install -Dm644 dist/org.andromeda.Link.desktop /app/share/applications/org.andromeda.Link.desktop
      - cp -r dist/icons /app/share/
    sources:
      - cargo-sources.json
      - type: dir
        path: ../..
        skip:
          - target
          - artifacts
          - apps/android/app/build
          - apps/android/core/build
          - apps/android/.gradle
